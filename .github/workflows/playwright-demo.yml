name: Playwright Smoke (manual)

# Manual smoke runner. The PR-time workflow lives in preview-deploy.yml;
# this one stays around for ad-hoc runs against an arbitrary URL, e.g.
# production sanity-checks or a long-lived staging environment.
#
#   gh workflow run "Playwright Smoke (manual)" \
#     -f preview_url=https://staging.climbr.io

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Target URL (leave blank to spin up local preview)"
        required: false
        default: ""

# Cancel an in-progress run when a new commit is pushed to the same PR.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root deps (Playwright + tooling)
        run: npm ci

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Install frontend deps
        run: npm install --prefix frontend --no-audit --no-fund

      # ---- Optional: deploy a Vercel preview ----
      # Only runs when all three secrets are configured. If any are missing we
      # fall through to the local-preview path below, which has no external
      # dependencies and is sufficient for the demo recording use case.
      - name: Vercel deploy (optional)
        id: vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' && github.event.inputs.preview_url == '' }}
        run: |
          set -euo pipefail
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Resolve PREVIEW_URL
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.preview_url }}" ]; then
            echo "preview_url=${{ github.event.inputs.preview_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.vercel.outputs.preview_url }}" ]; then
            echo "preview_url=${{ steps.vercel.outputs.preview_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "preview_url=http://localhost:4173" >> "$GITHUB_OUTPUT"
          fi
          echo "Will run against: $(grep preview_url "$GITHUB_OUTPUT")"

      - name: Run smoke
        run: npx playwright test tests/smoke.spec.ts --project=chromium
        env:
          PREVIEW_URL: ${{ steps.resolve.outputs.preview_url }}
          # Build-time Supabase placeholders used by the local-preview build.
          # The smoke spec mocks all REST calls and injects a session, so the
          # real values don't matter — just need to be set.
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: dummy-anon-key-for-smoke-test
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload screenshots (split artifact for quick preview)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: playwright-report/screenshots/
          retention-days: 14
          if-no-files-found: warn
